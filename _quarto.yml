project:
  type: book
  output-dir: docs
  post-render:
    - scripts/cleanup_quarto_support_dirs.sh
  preview: 
    port: 4200
    browser: true

execute:
  freeze: auto  # re-render only when source changes
  cache: true

book:
  title: "Topological Data Analysis with Julia"
  reader-mode: true
  # subtitle: "With examples in Julia"
  site-url: https://vituri.github.io/TDA_with_julia/
  repo-url: https://github.com/vituri/TDA_with_julia
  author: "G. Vituri"
  date: "2023-09-01"
  # sharing: [twitter, linkedin]

  chapters:
    - index.qmd
    - intro.qmd
    - part: "Topology"
      chapters: 
      - topology.qmd
      - simplicial.qmd
      - homology.qmd
    - part: "Working with Data"
      chapters: 
      - pointclouds.qmd
      - clustering.qmd
    - part: "Persistent Homology"
      chapters:
      - persistence.qmd
      - computing_ph.qmd
    - part: "TDA Methods"
      chapters:
      - tomato.qmd
      - mapper.qmd
      - ballmapper.qmd
      - mapper-general.qmd
    - part: "Applications"
      chapters: 
      - clustering_tomato.qmd
      - digits.qmd
      - timeseries.qmd
      - shapes.qmd
    - part: "Closing"
      chapters:
      - summary.qmd
      - references.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: style.css
    code-link: true
    page-layout: full
    max-width: 90vw
    preview-links: true

