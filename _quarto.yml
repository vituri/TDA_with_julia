project:
  type: book
  output-dir: docs
  resources:
    - "environment/**"
    - "scripts/setup.jl"
    - "reproductions/experiments/mapper2007/**"
    - "!reproductions/experiments/mapper2007/Manifest.toml"
    - "reproductions/experiments/lum2013/README.md"
    - "reproductions/experiments/lum2013/data/sources.toml"
    - "reproductions/experiments/lum2013/data/clinical.tsv"
    - "reproductions/experiments/lum2013/results/**"
    - "reproductions/experiments/lum2013/scripts/**"
    - "reproductions/experiments/lum2013/environment/**"
    - "reproductions/experiments/chazal2013/**"
    - "reproductions/experiments/perea-harer2015/**"
    - "reproductions/experiments/stability2007/**"
    - "!reproductions/experiments/stability2007/Manifest.toml"
    - "!reproductions/experiments/**/*.tmp"
  post-render:
    - scripts/cleanup_quarto_support_dirs.sh
  preview: 
    port: 4200
    browser: true

execute:
  freeze: false
  cache: true
  error: false

engines: [jupyter]
jupyter: tda-book

book:
  title: "Topological Data Analysis with Julia"
  reader-mode: true
  # subtitle: "With examples in Julia"
  site-url: https://vituri.github.io/TDA_with_julia/
  repo-url: https://github.com/vituri/TDA_with_julia
  author: "G. Vituri"
  date: "2026-10-03"
  # sharing: [twitter, linkedin]

  chapters:
    - index.qmd
    - intro.qmd
    - part: "Topology"
      chapters: 
      - topology.qmd
      - simplicial.qmd
      - homology.qmd
    - part: "Working with Data"
      chapters: 
      - pointclouds.qmd
      - clustering.qmd
    - part: "Persistent Homology"
      chapters:
      - persistence.qmd
      - computing_ph.qmd
      - uncertainty.qmd
    - part: "TDA Methods"
      chapters:
      - tomato.qmd
      - mapper.qmd
      - ballmapper.qmd
      - mapper-general.qmd
    - part: "Applications"
      chapters: 
      - clustering_tomato.qmd
      - digits.qmd
      - timeseries.qmd
      - shapes.qmd
    - part: reproducing-papers.qmd
      chapters:
      - reproduction-mapper2007.qmd
      - reproductions/lum2013.qmd
      - reproductions/chazal2013.qmd
      - reproductions/perea-harer2015.qmd
      - reproductions/stability2007.qmd
    - part: "Closing"
      chapters:
      - summary.qmd
      - references.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: style.css
    code-link: true
    page-layout: article
    preview-links: true
